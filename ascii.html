<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII Converter</title>  
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background-color: #ffffff;
  color: #000000;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 22px; 
  line-height: 1.6;
}
.container {
  width: 1000px;
  margin: 0 auto;
  padding: 0 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 30px 0;
  border-bottom: 2px solid #000000;
  margin-bottom: 30px;
}
.header h2 {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.1;
}
.nav-links {
  display: flex;
  gap: 35px;
}
.nav-links a {
  text-decoration: none;
  color: #000000;
  font-size: 18px;
  font-weight: 500;
  transition: color 0.2s ease;
}
.nav-links a:hover {
  color: #969696;
}
.nav-links a.active {
  color: #969696;
  padding-bottom: 4px;
}
.content-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 60px;
  align-items: start;
}
.main-text {
  max-width: 600px;
  font-size: 18px;
}
.input-group {
  display: flex;
  align-items: center;
  margin-top: 20px;
  gap: 15px;
}
input[type="text"] {
  padding: 10px;
  font-size: 16px;
  border: 2px solid #000000;
  outline: none;
  width: 200px;
}
.btn {
  background-color: #cccccc;
  color: #4e4e4e;
  border: none;
  padding: 10px 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  color: #696969;
}
.result-display {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
}
.image-container {
  width: 110%;
  background-color: #f8f8f8;
}
.image-container img {
  width: 100%;
  height: auto;
  display: block;
}
.footer {
  margin-top: 80px;
  padding: 40px 0;
  border-top: 1px solid #e0e0e0;
  text-align: center;
  font-size: 16px;
  color: #666666;
}
</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>ASCII<br>Converter</h2>
      <nav class="nav-links">
        <a href="index.html">Course</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="concepts.html">Concepts</a>
        <a href="database.html">Database</a>
        <a href="documentation.html">Documentation</a>
        <a href="devteam.html">Dev Team</a>
      </nav>
    </header>

    <main class="content-grid">
      <div class="main-text">
        <p>Enter any number from 0 to 127:</p>
        
        <div class="input-group">
          <input id="inputdec" type="text" placeholder="e.g. 65">
          <button class="btn" onclick="decToASCII()">Submit</button>
        </div>

        <div class="result-display">
          ASCII Value: <span id="demo"></span>
        </div>
      </div>

      <div class="image-column">
        <div class="image-container">
          <img src="ascii.png" alt="ASCII Chart">
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Powered by UB</p>
    </footer>
  </div>

  <script>
  function decToASCII() {
    var x = document.getElementById("inputdec").value;
    var res = String.fromCharCode(x);
    document.getElementById("demo").innerHTML = res;
    console.log(res);
  }
  </script>
</body>
</html>
