<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Binary to Hexadecimal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h2>Binary to Hexadecimal<br>Converter</h2>
      <nav class="nav-links">
        <a href="index.html">Course</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="concepts.html">Concepts</a>
        <a href="database.html">Database</a>
        <a href="documentation.html">Documentation</a>
        <a href="devteam.html">Dev Team</a>
      </nav>
    </header>

    <main class="content-grid">
      <div class="main-text">
        <p>Enter any 4-digit binary number below to convert it to its hexadecimal equivalent:</p>
        
        <div class="input-group">
          <input type="number" id="inputBin" placeholder="e.g. 1010">
          <button class="btn" onclick="binToHex()">Submit</button>
        </div>

        <div class="result-display">
          Hexadecimal Value: <span id="demo"></span>
        </div>
      </div>

      <div class="image-column">
        <div class="image-container">
          <img src="https://introcs.cs.princeton.edu/java/61data/images/0-F.png" alt="Binary to Hex Diagram">
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Powered by UB</p>
    </footer>
  </div>

  <script>
  function binToHex() {
    var x = document.getElementById("inputBin").value;
    var hexOut = parseInt(x, 2).toString(16).toUpperCase();
    document.getElementById("demo").innerHTML = hexOut;
  }
  </script>
</body>
</html>
