<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='red.png'">Turn this red!</button>

<img id="myImage" src="blue.png" style="width:400px">

<button onclick="document.getElementById('myImage').src='blue.png'">Turn this blue!</button>

</body>
</html>
